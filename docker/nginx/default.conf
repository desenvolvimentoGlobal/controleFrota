# Nginx — Controle de Frota (serve public/ e encaminha o PHP ao serviço app:9000).
server {
    listen 80;
    # IPv6 é obrigatório: no Alpine, "localhost" resolve para ::1 primeiro —
    # sem esta linha o healthcheck (wget localhost/up) falha, o container fica
    # unhealthy e o Traefik IGNORA o serviço (404 + certificado default).
    listen [::]:80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Compatível com post_max_size do PHP (docker/php/app.ini).
    client_max_body_size 60m;

    # -------------------------------------------------------------------------
    # ⚠️ O DNS DO DOCKER, RESOLVIDO A CADA REQUISIÇÃO
    #
    # `fastcgi_pass app:9000` resolve o nome UMA VEZ, quando o Nginx sobe, e
    # guarda o IP para sempre. Quando o container `app` é recriado — a cada
    # mudança de `.env.docker` ou de imagem — ele ganha IP novo e o Nginx segue
    # falando com o container morto: 502 até alguém reiniciar o `web`. O
    # sintoma engana: `docker compose ps` mostra tudo `running` e o site não
    # abre (foi o "sempre dá problema com o web" do contasReceber, 22/09/2026).
    #
    # Com o endereço numa VARIÁVEL o Nginx consulta o resolver a cada
    # requisição. 127.0.0.11 é o DNS embutido do Docker; `valid=10s` limita a
    # dez segundos de 502 no pior caso.
    # -------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # Só executa .php que existe de fato em public/ (index.php).
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # A variável é o que força a re-resolução; sem ela o `resolver` acima
        # não tem efeito nenhum sobre esta linha.
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Acompanha max_execution_time=120 (PDF/Excel do relatório de custos).
        fastcgi_read_timeout 120s;
    }

    # Bloqueia arquivos ocultos (.env, .git, etc.), exceto /.well-known.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
