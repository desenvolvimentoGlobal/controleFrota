# Nginx — Gestão de Pessoas (encaminha PHP ao serviço app:9000).
server {
    listen 80;
    # IPv6 é obrigatório: no Alpine, "localhost" resolve para ::1 primeiro —
    # sem esta linha o healthcheck (wget localhost/up) falha, o container fica
    # unhealthy e o Traefik IGNORA o serviço (404 + certificado default).
    listen [::]:80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Compatível com post_max_size do PHP (docker/php/app.ini).
    client_max_body_size 60m;

    # DNS interno do Docker. Sem isto o nginx resolve "app" UMA ÚNICA VEZ, no
    # boot, e guarda o IP para sempre: quando o container app é recriado (todo
    # deploy) ele ganha outro IP, o nginx segue no antigo e responde 502 — o
    # healthcheck falha, o Traefik ignora o serviço e o site vira 404.
    # Com resolver + upstream em VARIÁVEL, o nome é re-resolvido em runtime.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Variável (não literal): força o nginx a consultar o resolver acima.
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
