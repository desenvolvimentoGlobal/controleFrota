; =============================================================================
; Pool PHP-FPM da aplicação (substitui o www.conf padrão da imagem).
; Perfil conservador para uma aplicação interna de baixo acesso simultâneo.
; =============================================================================
[www]

user = www-data
group = www-data

; O Nginx (serviço "web") conecta em app:9000.
listen = 9000

; IMPORTANTE: clear_env = no preserva as variáveis de ambiente injetadas pelo
; Docker Compose (DB_HOST, etc.) para os workers do FPM.
clear_env = no

; Encaminha a saída dos workers para o log do FPM (visível em docker logs).
catch_workers_output = yes
decorate_workers_output = no

; -----------------------------------------------------------------------------
; Gerenciamento de processos (dynamic) — evita processos demais e controla RAM.
; -----------------------------------------------------------------------------
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
