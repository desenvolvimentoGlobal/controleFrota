; =============================================================================
; Ajustes de PHP para a aplicação Gestão de Pessoas.
; Uploads modestos (planilha de regras ~150KB); PDFs/Excel de relatório.
; =============================================================================

memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 60M
max_execution_time = 120
max_input_vars = 3000
date.timezone = America/Sao_Paulo

; -----------------------------------------------------------------------------
; OPcache
; -----------------------------------------------------------------------------
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Ambiente LOCAL: revalida timestamps para refletir edições feitas via bind
; mount. Em PRODUÇÃO, para ganho de performance, defina
; opcache.validate_timestamps = 0 e recompile apenas no deploy.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
